<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swarajya - Login</title>
    <style>
        :root {
            --primary-color: #ff9800;
            --secondary-color: #f44336;
            --glass-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; padding: 0; font-family: 'Poppins', sans-serif; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(45deg, #181c20, #232a34); overflow: hidden;
        }

        .background-circles { position: absolute; width: 100%; height: 100%; overflow: hidden; z-index: 1; }
        .circle { position: absolute; background: var(--glass-bg); border-radius: 50%; animation: float 20s infinite linear; }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }

        .login-container {
            position: relative; z-index: 2; background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px; border-radius: 20px; width: 350px; text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .login-container h2 { color: var(--primary-color); text-transform: uppercase; margin-bottom: 30px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; color: #ccc; font-size: 14px; margin-bottom: 5px; }
        
        .input-group input {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: rgba(255, 255, 255, 0.1); color: white; outline: none; box-sizing: border-box;
        }

        .login-btn {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        .login-btn:hover { transform: scale(1.02); box-shadow: 0 5px 15px rgba(255, 152, 0, 0.3); }
        .footer-text { color: #777; margin-top: 20px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="background-circles" id="circles"></div>

    <div class="login-container">
        <h2>🚩 SWARAJYA</h2>
        <form id="loginForm" action="login.php" method="POST">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            
            <button type="submit" class="login-btn">LOGIN</button>
            
            <p style="margin-top: 15px;">
                <a href="registerpage.html" style="color: var(--primary-color); text-decoration: none; font-size: 14px;">New Register</a>
            </p>
        </form>
        <div class="footer-text">Swarajya Restaurant Management © 2025</div>
    </div>

    <script>
        // बॅकग्राउंड सर्कल्स बनवणे
        const container = document.getElementById('circles');
        for (let i = 0; i < 15; i++) {
            const circle = document.createElement('div');
            circle.classList.add('circle');
            let size = Math.random() * 50 + 10 + 'px';
            circle.style.width = size; circle.style.height = size;
            circle.style.left = Math.random() * 100 + 'vw';
            circle.style.animationDuration = Math.random() * 10 + 10 + 's';
            container.appendChild(circle);
        }
    </script>
</body>
</html>
